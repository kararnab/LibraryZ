kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# KMP plugin's max-tested AGP is 8.5; we're on 8.7.x. The combo is known to
# work, so silence the noisy "compatibility" warning.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
# Silence the "iOS targets disabled on this machine" warning on Linux/Windows
# hosts — they're declared in build.gradle.kts and only buildable on macOS.
kotlin.native.ignoreDisabledTargets=true
