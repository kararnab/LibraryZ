kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Kotlin/Wasm compilation is memory-hungry (compose-multiplatform
# wasm bitcode generation). 2g OOMs on the dev build with pdf.js wiring.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.parallel=true
# Silence the "iOS targets disabled on this machine" warning on Linux/Windows
# hosts — they're declared in build.gradle.kts and only buildable on macOS.
kotlin.native.ignoreDisabledTargets=true
# The app's user-visible version, shown in Settings and used as the Android
# versionName. One place, so every target reports the same number.
libraryz.version=0.1.0
