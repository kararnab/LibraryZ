apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Consented app telemetry, read through a role that can only SELECT the
  # three telemetry tables (deploy/postgres/telemetry-reader.sql).
  - name: Telemetry
    uid: telemetry
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader
    jsonData:
      database: libraryz
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: grafana_reader
