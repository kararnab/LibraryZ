_format_version: "3.0"
_transform: true

# Declarative config for Kong's DB-less mode (PLAN.md Slice 6.2). Kong is the
# edge gateway: all client traffic enters here, gets rate-limited / size-checked,
# and is proxied to the libraryz replicas on the compose network. They aren't
# exposed on the host.
#
# Rate-limit policy is `redis` so counters are shared across libraryz instances
# (a `local` policy would reset per replica). All limits here are per-IP. Per-
# account login throttling lives in the app (iam's limiter, also on Redis), on
# top of these. Per-user Kong limits would need Kong consumers keyed on our
# JWT's `iss`/`kid` (PLAN.md item 93); revisit if abuse warrants it.
#
# Plugin precedence is route > service > global, so the upload route's larger
# request-size-limiting config overrides the service-wide 5 MB ceiling, and
# per-route rate limits override the service-wide 60/min fallback.

# The upstream load-balances across the libraryz replicas (round-robin) and
# takes one out of rotation when it can't serve:
#  - actively: /ready fails while its DB or blob storage is unreachable, and
#    while it drains on shutdown (LIBRARYZ_DRAIN_DELAY), so a rolling deploy
#    moves traffic off an instance before its listener closes;
#  - passively: connection failures and timeouts on real requests eject a
#    replica that died outright (kill -9, OOM) without waiting for a probe.
# A replica comes back after two good /ready checks. Add one target per
# replica.
upstreams:
  - name: libraryz-upstream
    targets:
      - target: libraryz-1:8080
      - target: libraryz-2:8080
    healthchecks:
      active:
        type: http
        http_path: /ready
        timeout: 3
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
          http_statuses: [500, 502, 503, 504]
      passive:
        healthy:
          successes: 0 # only active checks bring a replica back
        unhealthy:
          tcp_failures: 2
          timeouts: 3
          # Gateway-style failures only: an app 500 on one route shouldn't
          # eject a replica (both would flap on the same bug).
          http_statuses: [502, 503, 504]
          http_failures: 5

# Global plugins, on every request:
#  - correlation-id gives each request an X-Request-ID (kept if the client
#    sent one) that libraryz logs and echoes, so an edge log line and an app
#    log line can be matched (internal/obs).
#  - prometheus counts requests, statuses (429s from the limits below) and
#    latency at the edge; Prometheus scrapes it from Kong's status listener
#    (KONG_STATUS_LISTEN, not published on the host).
plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true

services:
  - name: libraryz
    host: libraryz-upstream
    port: 8080
    protocol: http
    # A request that can't connect to one replica is retried on the other
    # (connection errors only, so nothing is ever sent twice). A short connect
    # timeout keeps a stopped replica's address from stalling it.
    retries: 3
    connect_timeout: 2000
    # Service-level fallbacks. Anything not matched by a more specific route
    # below still goes through these.
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
          limit_by: ip
          fault_tolerant: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 5
          size_unit: megabytes
    routes:
      # POST /auth/login — credential stuffing / brute force.
      - name: auth-login
        paths: ["~/auth/login$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              hour: 30
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true

      # POST /auth/signup — account farming.
      - name: auth-signup
        paths: ["~/auth/signup$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true

      # POST /auth/refresh — clients refresh about once per access-token
      # lifetime (15 min) per session, so this is generous. Refresh tokens are
      # 256-bit random, so guessing is hopeless; the limit only blunts abuse,
      # and a replayed token revokes its whole session in the app (iam reuse
      # detection).
      - name: auth-refresh
        paths: ["~/auth/refresh$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 300
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true

      # POST /auth/logout — cheap and unauthenticated (takes a refresh token).
      - name: auth-logout
        paths: ["~/auth/logout$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true

      # POST /auth/password-reset — anonymous and emails someone, so floods are
      # stopped here per IP; the app adds a per-account cap (2 min / 5 a day) that
      # protects an inbox even from rotating IPs.
      - name: auth-password-reset
        paths: ["~/auth/password-reset$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              hour: 20
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true
      # POST /auth/password-reset/complete and /auth/email-verification/complete —
      # tokens are 256-bit random, so this only blunts abuse.
      - name: auth-recovery-complete
        paths: ["~/auth/(password-reset|email-verification)/complete$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 60
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true
      # POST /me/email-verification — authenticated resend; the app caps it per
      # account too.
      - name: me-email-verification
        paths: ["~/me/email-verification$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true

      # POST /works/{id}/editions — large multipart upload (≤500 MiB).
      # The real allowance is the app's per-account quota (catalog.UploadQuota,
      # LIBRARYZ_UPLOAD_QUOTA_*); this per-IP limit is only a flood guard, set
      # well above it so users sharing an IP (NAT, campus) aren't capped as a
      # group.
      # request_buffering off so the body streams to libraryz instead of being
      # spooled in Kong. allowed_payload_size is slightly above the app cap
      # (LIBRARYZ_MAX_UPLOAD_BYTES = 500 MiB ≈ 524 MB) so libraryz enforces the
      # precise byte cap and Kong is the coarse outer guard.
      - name: edition-upload
        paths: ["~/works/[^/]+/editions$"]
        methods: [POST]
        strip_path: false
        request_buffering: false
        plugins:
          - name: rate-limiting
            config:
              hour: 30
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 550
              size_unit: megabytes

      # POST /telemetry/crashes and /telemetry/events — anonymous, consented
      # crash reports and usage events. The app batches them (about one
      # request a minute while used), so this only stops floods; the app caps
      # the body (256 KiB crashes, 64 KiB events) and checks every item.
      - name: telemetry
        paths: ["~/telemetry/(crashes|events)$"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 300
              policy: redis
              redis:
                host: redis
                port: 6379
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
              size_unit: megabytes

      # GET /editions/{id}/download — large streaming download.
      - name: edition-download
        paths: ["~/editions/[^/]+/download$"]
        methods: [GET]
        strip_path: false
        response_buffering: false

      # Catch-all so the service's fallback plugins still get attached to
      # everything else (Kong only runs service-level plugins on requests that
      # match at least one route on that service).
      - name: libraryz-default
        paths: ["/"]
        strip_path: false
