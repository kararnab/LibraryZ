openapi: 3.1.0
info:
  title: LibraryZ API
  version: 0.1.0
  description: |
    Phase 1 surface for LibraryZ: auth, catalog (works + editions), and
    content-addressable file storage. See PLAN.md in the repo root.
servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: health
  - name: auth
  - name: catalog
  - name: editions
  - name: contributions
  - name: library
  - name: recommendations

security: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/signup:
    post:
      tags: [auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT (returned in Authorization header)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. JWT is returned in the `Authorization` response header.
          headers:
            Authorization:
              description: "`Bearer <jwt>`"
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      summary: Return the currently authenticated user
      description: |
        Reads live DB state for `is_moderator`, not the JWT — so a user
        promoted via SQL while logged in will see the new flag without
        needing to re-login.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /works:
    get:
      tags: [catalog]
      summary: List works
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Work" }
    post:
      tags: [catalog]
      summary: Create a new work
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /works/search:
    get:
      tags: [catalog]
      summary: Search works by free-text query
      description: |
        Matches against `title`, `authors`, and `description`. On Postgres
        uses a `tsvector` GIN index with the `simple` text-search
        configuration (no stemming / stopwords). On sqlite (the test DB)
        falls back to `LOWER(col) LIKE LOWER('%q%')` across the same
        three columns. Results are ordered by `created_at DESC` in both
        cases; `ts_rank` is intentionally deferred until there's a real
        corpus to evaluate against. Empty `q` returns 400.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Work" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /works/{id}:
    get:
      tags: [catalog]
      summary: Get a single work with its editions and tags
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "404":
          $ref: "#/components/responses/NotFound"

  /works/{id}/editions:
    post:
      tags: [editions]
      summary: Upload a new edition (file) for a work
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [format, file]
              properties:
                format:
                  type: string
                  description: "pdf | epub | mobi | azw3 | djvu | cbz | txt | ..."
                language:
                  type: string
                  description: BCP-47 language tag (optional)
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /editions/{id}:
    get:
      tags: [editions]
      summary: Get edition metadata
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "404":
          $ref: "#/components/responses/NotFound"

  /works/{id}/contributions:
    post:
      tags: [contributions]
      summary: Submit a proposed edit to a work
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContributionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /contributions:
    get:
      tags: [contributions]
      summary: List contributions
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contribution" }

  /contributions/{id}:
    get:
      tags: [contributions]
      summary: Get a single contribution
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "404":
          $ref: "#/components/responses/NotFound"

  /contributions/{id}/approve:
    post:
      tags: [contributions]
      summary: Approve a pending contribution and apply its patch to the work
      description: |
        Applies whitelisted fields from `patch` onto the target Work in a
        single transaction; non-whitelisted keys are silently dropped.
        Slice 2.1 only requires authentication; slice 2.2 will add the
        moderator gate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contribution is not pending
          content:
            text/plain:
              schema: { type: string }

  /contributions/{id}/reject:
    post:
      tags: [contributions]
      summary: Reject a pending contribution (no changes applied to the work)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contribution is not pending
          content:
            text/plain:
              schema: { type: string }

  /me/contributions:
    get:
      tags: [contributions]
      summary: List the calling user's own contributions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contribution" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/library:
    get:
      tags: [library]
      summary: List the calling user's personal-library entries
      description: |
        Each entry embeds the target `work` (with its editions) so the My
        Library screen renders without a second round-trip. Ordered by
        `updated_at` descending.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [want, reading, read] }
        - in: query
          name: shelf
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserBook" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/library/{id}:
    parameters:
      - $ref: "#/components/parameters/UUIDPathId"
    get:
      tags: [library]
      summary: Get the calling user's library entry for a work
      description: "`{id}` is the work id."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBook" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [library]
      summary: Create or update the calling user's library entry for a work
      description: |
        Upsert. Every field is optional and only present fields are applied
        (partial patch). On first touch the entry defaults to status `want`.
        Setting status to `reading` stamps `started_at`; `read` stamps
        `finished_at` and forces `progress_percent` to 100 unless a percent is
        sent in the same request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertLibraryEntryRequest"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBook" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      summary: Remove the work from the calling user's library
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/recommendations:
    get:
      tags: [recommendations]
      summary: Personalized work recommendations for the calling user
      description: |
        Naive v0: content-based on shared authors/tags with the user's liked
        library items (rating-weighted), with a popularity fallback for cold
        start / short result sets. Read-only; never recommends a work already
        in the user's library.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recommendation" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/recommendations/{id}/dismiss:
    post:
      tags: [recommendations]
      summary: Hide a work from the caller's future recommendations
      description: "`{id}` is the work id. Idempotent."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "204":
          description: Dismissed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /editions/{id}/download:
    get:
      tags: [editions]
      summary: Download the edition bytes
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: File stream
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-SHA256:
              schema: { type: string, description: "Hex sha256 of the bytes (matches Edition.sha256)" }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UUIDPathId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Bad request
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        text/plain:
          schema: { type: string }
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema: { type: string }
    InternalError:
      description: Server error
      content:
        text/plain:
          schema: { type: string }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: Healthy }
        time:   { type: string, format: date-time }

    Me:
      type: object
      required: [id, email, name, is_moderator]
      properties:
        id:           { type: integer }
        email:        { type: string, format: email }
        name:         { type: string }
        is_moderator: { type: boolean }

    SignUpRequest:
      type: object
      required: [email, password, name]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 1 }
        name:     { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    CreateWorkRequest:
      type: object
      required: [title]
      properties:
        title:            { type: string }
        subtitle:         { type: string }
        authors:          { type: string, description: "Phase 1: semicolon-separated. Normalized in Phase 2." }
        description:      { type: string }
        language:         { type: string }
        publication_year: { type: integer }
        isbn:             { type: string }
        openlibrary_id:   { type: string }

    Work:
      type: object
      properties:
        id:               { type: string, format: uuid }
        title:            { type: string }
        subtitle:         { type: string }
        authors:          { type: string }
        description:      { type: string }
        language:         { type: string }
        publication_year: { type: integer }
        isbn:             { type: string }
        openlibrary_id:   { type: string }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
        editions:
          type: array
          items: { $ref: "#/components/schemas/Edition" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    Edition:
      type: object
      properties:
        id:          { type: string, format: uuid }
        work_id:     { type: string, format: uuid }
        format:      { type: string }
        language:    { type: string }
        size_bytes:  { type: integer, format: int64 }
        sha256:      { type: string }
        uploaded_by: { type: integer }
        created_at:  { type: string, format: date-time }

    Tag:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    SubmitContributionRequest:
      type: object
      required: [patch]
      properties:
        patch:
          type: object
          description: |
            Flat partial object of proposed Work field overrides. Allowed
            keys (anything else is silently dropped on Approve): `title`,
            `subtitle`, `authors`, `description`, `language`,
            `publication_year`, `isbn`, `openlibrary_id`. An empty patch
            is rejected with 400.
          additionalProperties: true

    Contribution:
      type: object
      properties:
        id:              { type: string, format: uuid }
        work_id:         { type: string, format: uuid }
        contributor_id:  { type: integer }
        status:          { type: string, enum: [pending, approved, rejected] }
        patch:
          type: object
          description: As submitted; whitelisted at Approve time, not at storage.
          additionalProperties: true
        current:
          type: object
          description: |
            The target Work's present value for each field named in `patch`
            — the "old" side of the moderator-queue diff. Resolved at read
            time, so it reflects the Work as it stands now. Keys mirror
            `patch`. Omitted when empty.
          additionalProperties: true
        reviewer_id:     { type: integer, nullable: true }
        decided_at:      { type: string, format: date-time, nullable: true }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    UpsertLibraryEntryRequest:
      type: object
      description: |
        Partial patch — every field is optional; only present fields are
        applied. Send `rating: null` to clear a rating.
      properties:
        status:           { type: string, enum: [want, reading, read] }
        shelf:            { type: string, description: "Free-form collection name." }
        current_page:     { type: integer, minimum: 0 }
        total_pages:      { type: integer, minimum: 0 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        rating:           { type: integer, minimum: 1, maximum: 5, nullable: true }
        notes:            { type: string }

    UserBook:
      type: object
      description: One user's personal-library entry for a work.
      properties:
        id:               { type: string, format: uuid }
        user_id:          { type: integer }
        work_id:          { type: string, format: uuid }
        status:           { type: string, enum: [want, reading, read] }
        shelf:            { type: string }
        current_page:     { type: integer }
        total_pages:      { type: integer }
        progress_percent: { type: integer }
        rating:           { type: integer, nullable: true, description: "1..5 when set." }
        notes:            { type: string }
        started_at:       { type: string, format: date-time, nullable: true }
        finished_at:      { type: string, format: date-time, nullable: true }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
        work:
          allOf:
            - $ref: "#/components/schemas/Work"
          description: |
            The target work, embedded on read so the My Library list renders
            without a second request. Omitted if the work can't be resolved.

    Recommendation:
      type: object
      description: One recommended work plus why it surfaced.
      properties:
        work:
          $ref: "#/components/schemas/Work"
        reason:
          type: string
          description: >
            Human-readable basis, e.g. "More from authors you've read",
            "Based on tags in your library", or "Popular on LibraryZ".
        score:
          type: number
          description: Internal ranking score; omitted (0) for popularity fallbacks.
