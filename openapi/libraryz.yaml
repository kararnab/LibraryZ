openapi: 3.1.0
info:
  title: LibraryZ API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    LibraryZ backend: auth and sessions, catalog (works + editions with
    content-addressed file storage), crowdsourced edits with moderation,
    personal libraries, and recommendations. See PLAN.md and ARCHITECTURE.md
    in the repo root.

    **Every operation has a cURL sample** (`x-codeSamples`). They assume:

    ```sh
    BASE=http://localhost:8080          # Kong in `docker compose up`
    TOKEN=...      REFRESH=...          # from POST /auth/login (see its sample)
    WORK_ID=...    EDITION_ID=...    CONTRIBUTION_ID=...    SESSION_ID=...
    ```

    **Authentication** (built on [kararnab/iam](https://github.com/kararnab/iam)).
    `POST /auth/signup` and `POST /auth/login` return a token pair in the JSON
    body: a short-lived access token (JWT, 15 minutes by default) and a
    single-use refresh token. Send the access token as
    `Authorization: Bearer <token>`. On a `401`, call `POST /auth/refresh`
    once and retry; if that also fails, log in again. Presenting an
    already-used refresh token revokes the whole session. Access tokens are
    stateless by default: logging out stops refreshing at once, but an issued
    access token works until it expires (unless the server runs with
    `LIBRARYZ_VERIFY_SESSION_ON_ACCESS=true`). Roles (e.g. `moderator`) and
    a disabled account are re-read on every authenticated request, so they
    apply at once.

    **Errors.** `4xx`/`5xx` bodies are short `text/plain` messages (`4xx`
    messages are safe to show to users), except where an operation documents
    a JSON body (e.g. the `409` on edition upload). `5xx` bodies are generic;
    details are only logged server-side.

    **Rate limits.** In the compose/production setup Kong enforces per-IP
    limits (login 5/min, signup 3/min, refresh 20/min, logout 10/min,
    edition upload 10/hour, everything else 60/min) and answers `429` when
    exceeded. On top of that the app throttles failed logins per account
    (5 failures in 15 minutes) and per IP (100), with a growing back-off;
    those `429`s carry `Retry-After`. Request bodies are capped at 5 MB
    except edition uploads (500 MiB).
servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: health
    description: "Liveness and readiness probes."
  - name: auth
    description: "Accounts and sessions (access + refresh tokens)."
  - name: catalog
    description: "Works: list, search, create."
  - name: editions
    description: "Files attached to a work: upload, metadata, download."
  - name: contributions
    description: "Crowdsourced edits to works and their moderation."
  - name: library
    description: "The caller's personal library (shelves, status, progress, ratings)."
  - name: recommendations
    description: "Personalized suggestions (matrix factorization with a content/popularity fallback)."
  - name: moderation
    description: "Moderator-only takedowns (soft delete, audited)."

security: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: Process is up. Touches no dependencies — see `/ready`.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/health"
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ready:
    get:
      operationId: getReady
      tags: [health]
      summary: Readiness probe
      description: |
        Checks that the database and blob storage are reachable (2s timeout
        each). Use this for load-balancer / orchestrator readiness; use
        `/health` for liveness. Failure details are logged server-side, not
        returned.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -w '\n%{http_code}\n' "$BASE/ready"
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: At least one dependency is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a new user account and start a session
      description: |
        Passwords are hashed with argon2id and must be 8–1024 characters.
        Returns the same token pair as `POST /auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/auth/signup" -H 'Content-Type: application/json' \
              -d '{"email":"you@example.com","password":"correct horse battery","name":"You"}' > tokens.json
            TOKEN=$(jq -r .access_token tokens.json)
            REFRESH=$(jq -r .refresh_token tokens.json)
      responses:
        "201":
          description: Created; signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          description: Email already registered
          content:
            text/plain:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for an access + refresh token pair
      description: |
        Starts a new session. The access token is a short-lived JWT
        (`LIBRARYZ_ACCESS_TOKEN_TTL`, default 15m); renew it with
        `POST /auth/refresh`. Tokens are returned in the body only.
        Unknown accounts and wrong passwords get the same `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            # Keep both tokens: the access token expires in 15 minutes.
            curl -s -X POST "$BASE/auth/login" -H 'Content-Type: application/json' \
              -d '{"email":"you@example.com","password":"correct horse battery"}' > tokens.json
            TOKEN=$(jq -r .access_token tokens.json)
            REFRESH=$(jq -r .refresh_token tokens.json)
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: |
            Too many requests: Kong's per-IP limit, or the app's failed-login
            throttle for this account or IP (with `Retry-After`).
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed
              schema: { type: integer }
          content:
            text/plain:
              schema: { type: string }
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate a refresh token for a new token pair
      description: |
        The presented refresh token is spent and a new pair is returned.
        Presenting an already-spent token is treated as theft: the whole
        session (token family) is revoked and the client must log in again.
        Clients must therefore serialize refreshes per session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            # Single use: store the new refresh_token, the old one is now spent.
            curl -s -X POST "$BASE/auth/refresh" -H 'Content-Type: application/json' \
              -d "{\"refresh_token\":\"$REFRESH\"}" > tokens.json
            TOKEN=$(jq -r .access_token tokens.json)
            REFRESH=$(jq -r .refresh_token tokens.json)
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Unknown, expired, revoked, or reused refresh token, or the user is
            disabled — log in again
          content:
            text/plain:
              schema: { type: string }
        "409":
          description: |
            The token was rotated by a concurrent refresh moments ago (only
            with a non-zero reuse grace window); use that refresh's result.
          content:
            text/plain:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session a refresh token belongs to
      description: |
        Revokes the refresh token's session. No access token needed (it may
        already have expired). Unknown tokens are ignored. Outstanding access
        tokens for the session stay valid until they expire (≤ access TTL)
        unless the server verifies sessions on access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/auth/logout" -H 'Content-Type: application/json' \
              -d "{\"refresh_token\":\"$REFRESH\"}"
      responses:
        "204":
          description: Logged out
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: End every session of the current user
      description: |
        Revokes every session of the user, so no refresh token works any
        more. Outstanding access tokens stay valid until they expire
        (≤ access TTL) unless the server verifies sessions on access
        (`LIBRARYZ_VERIFY_SESSION_ON_ACCESS=true`).
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/auth/logout-all" -H "Authorization: Bearer $TOKEN"
      responses:
        "204":
          description: All sessions ended
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return the currently authenticated user
      description: |
        Reads live DB state for `roles` / `is_moderator`, not the JWT — so a
        user promoted via SQL while logged in sees the new flag at once, as
        do moderator-only routes.
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/auth/me" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the current user's sessions (devices)
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/me/sessions" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: End one of the current user's sessions
      description: |
        The session can no longer refresh. Its outstanding access token works
        until it expires unless the server verifies sessions on access.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X DELETE "$BASE/me/sessions/$SESSION_ID" -H "Authorization: Bearer $TOKEN"
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /works:
    get:
      operationId: listWorks
      tags: [catalog]
      summary: List works
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/works?limit=50&offset=0"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Work" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createWork
      tags: [catalog]
      summary: Create a new work
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequest"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/works" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d '{"title":"Moby-Dick","authors":"Herman Melville","publication_year":1851}'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /works/search:
    get:
      operationId: searchWorks
      tags: [catalog]
      summary: Search works by free-text query
      description: |
        Matches against `title`, `subtitle`, `authors`, and `description`,
        most relevant first. On Postgres uses a weighted `tsvector` GIN index
        (`simple` configuration — no stemming / stopwords) queried with
        `websearch_to_tsquery`, so `"exact phrase"`, `or`, and `-exclude`
        work; results are ordered by `ts_rank` (title > subtitle/authors >
        description), then `created_at DESC`. On sqlite (the test DB) falls
        back to a literal, case-insensitive substring match (`%` and `_` are
        not wildcards) ordered title hits, then subtitle/author hits, then
        description hits, then `created_at DESC`. Empty `q` returns 400.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -G "$BASE/works/search" \
              --data-urlencode 'q="herman melville" -abridged' \
              --data-urlencode limit=20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Work" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /works/{id}:
    get:
      operationId: getWork
      tags: [catalog]
      summary: Get a single work with its editions and tags
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/works/$WORK_ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      operationId: removeWork
      tags: [moderation]
      summary: Remove a work (moderator, or its creator while empty)
      description: |
        Moderators can take down any work; any other user can remove only a
        work they created that has no editions (the upload client does this
        when a new work's first upload is rejected). Removes the work and all
        of its editions. Soft
        delete: the rows are kept with who/when/why for audit (and can be
        restored in the DB), but the work disappears from list, search, get,
        download, personal libraries and recommendations. The files are
        purged by the blob GC after `LIBRARYZ_BLOB_GC_RETENTION`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemovalRequest" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X DELETE "$BASE/works/$WORK_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d '{"reason":"DMCA notice #42"}'
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /works/{id}/editions:
    post:
      operationId: uploadEdition
      tags: [editions]
      summary: Upload a new edition (file) for a work
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [format, file]
              properties:
                format:
                  type: string
                  description: "pdf | epub | mobi | azw3 | djvu | cbz | txt | ..."
                language:
                  type: string
                  description: BCP-47 language tag (optional)
                file:
                  type: string
                  format: binary
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/works/$WORK_ID/editions" -H "Authorization: Bearer $TOKEN" \
              -F format=epub -F language=en -F file=@moby-dick.epub
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The file is already in the library as an edition, on this work or
            another one. Matched on the sha256 of the uploaded bytes, or of the
            bytes after sanitization. Nothing is recorded. If that edition was
            removed by a moderator, `edition_id` / `work_id` are omitted and
            `error` says so (a takedown can't be undone by re-uploading).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateEdition" }
        "413":
          description: >
            The file couldn't be sanitized within the server's memory or time
            budget (for example, a PDF whose compressed object streams
            inflate to gigabytes). Nothing is recorded.
          content:
            text/plain:
              schema: { type: string }
        "415":
          description: Format is not on the allowlist (currently PDF, EPUB, TXT)
          content:
            text/plain:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /editions/{id}:
    get:
      operationId: getEdition
      tags: [editions]
      summary: Get edition metadata
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/editions/$EDITION_ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      operationId: removeEdition
      tags: [moderation]
      summary: Remove an edition (moderator)
      description: |
        Moderator-only takedown of one edition (soft delete; see
        `DELETE /works/{id}`). Re-uploading byte-identical content afterwards
        is refused with 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemovalRequest" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X DELETE "$BASE/editions/$EDITION_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d '{"reason":"broken file"}'
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /works/{id}/contributions:
    post:
      operationId: submitContribution
      tags: [contributions]
      summary: Submit a proposed edit to a work
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContributionRequest"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/works/$WORK_ID/contributions" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d '{"patch":{"title":"Moby-Dick; or, The Whale","publication_year":1851}}'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /contributions:
    get:
      operationId: listContributions
      tags: [contributions]
      summary: List contributions
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/contributions?status=pending&limit=50"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contribution" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /contributions/{id}:
    get:
      operationId: getContribution
      tags: [contributions]
      summary: Get a single contribution
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/contributions/$CONTRIBUTION_ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

  /contributions/{id}/approve:
    post:
      operationId: approveContribution
      tags: [contributions]
      summary: Approve a pending contribution and apply its patch to the work
      description: |
        Moderator-only. Atomically moves the contribution out of `pending`
        and applies its `patch` to the target Work in the same transaction;
        if another moderator decided it first, returns 409 and applies
        nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/contributions/$CONTRIBUTION_ID/approve" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contribution is not pending
          content:
            text/plain:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contributions/{id}/reject:
    post:
      operationId: rejectContribution
      tags: [contributions]
      summary: Reject a pending contribution (no changes applied to the work)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/contributions/$CONTRIBUTION_ID/reject" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contribution is not pending
          content:
            text/plain:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/contributions:
    get:
      operationId: listMyContributions
      tags: [contributions]
      summary: List the calling user's own contributions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/me/contributions?status=pending" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contribution" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/library:
    get:
      operationId: listLibrary
      tags: [library]
      summary: List the calling user's personal-library entries
      description: |
        Each entry embeds the target `work` (with its editions) so the My
        Library screen renders without a second round-trip. Ordered by
        `updated_at` descending.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [want, reading, read] }
        - in: query
          name: shelf
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/me/library?status=reading" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserBook" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/library/{id}:
    parameters:
      - $ref: "#/components/parameters/UUIDPathId"
    get:
      operationId: getLibraryEntry
      tags: [library]
      summary: Get the calling user's library entry for a work
      description: "`{id}` is the work id."
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/me/library/$WORK_ID" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBook" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      operationId: upsertLibraryEntry
      tags: [library]
      summary: Create or update the calling user's library entry for a work
      description: |
        Upsert. Every field is optional and only present fields are applied
        (partial patch). On first touch the entry defaults to status `want`.
        Setting status to `reading` stamps `started_at`; `read` stamps
        `finished_at` and forces `progress_percent` to 100 unless a percent is
        sent in the same request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertLibraryEntryRequest"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X PUT "$BASE/me/library/$WORK_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d '{"status":"reading","progress_percent":40,"rating":4}'
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBook" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeLibraryEntry
      tags: [library]
      summary: Remove the work from the calling user's library
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X DELETE "$BASE/me/library/$WORK_ID" -H "Authorization: Bearer $TOKEN"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

  /me/recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      summary: Personalized work recommendations for the calling user
      description: |
        Naive v0: content-based on shared authors/tags with the user's liked
        library items (rating-weighted), with a popularity fallback for cold
        start / short result sets. Read-only; never recommends a work already
        in the user's library.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s "$BASE/me/recommendations?limit=20" -H "Authorization: Bearer $TOKEN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recommendation" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/recommendations/{id}/dismiss:
    post:
      operationId: dismissRecommendation
      tags: [recommendations]
      summary: Hide a work from the caller's future recommendations
      description: "`{id}` is the work id. Idempotent."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -s -X POST "$BASE/me/recommendations/$WORK_ID/dismiss" -H "Authorization: Bearer $TOKEN"
      responses:
        "204":
          description: Dismissed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /editions/{id}/download:
    get:
      operationId: downloadEdition
      tags: [editions]
      summary: Download the edition bytes
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            # -OJ saves under the server-provided "<Title> - <Authors>.<format>" name.
            curl -s -OJ "$BASE/editions/$EDITION_ID/download"
      responses:
        "200":
          description: File stream
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-SHA256:
              schema: { type: string, description: "Hex sha256 of the bytes (matches Edition.sha256)" }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token from `POST /auth/login` or `POST /auth/refresh`. Expires
        after `LIBRARYZ_ACCESS_TOKEN_TTL` (15m); revoked immediately by
        `POST /auth/logout-all`.

  parameters:
    UUIDPathId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Bad request
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: >
        Missing, malformed, expired or revoked access token (refresh it with
        `POST /auth/refresh`), or wrong credentials on login
      content:
        text/plain:
          schema: { type: string }
    Forbidden:
      description: >
        Authenticated but not permitted (e.g. the user lacks the
        `moderator` role)
      content:
        text/plain:
          schema: { type: string }
    AuthUnavailable:
      description: The session store could not be reached; retry (the credential was not judged)
      content:
        text/plain:
          schema: { type: string }
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema: { type: string }
    TooManyRequests:
      description: Rate limit exceeded (enforced by the Kong gateway, per client IP)
      headers:
        Retry-After:
          description: Seconds until the limit resets
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: API rate limit exceeded }
    InternalError:
      description: Server error
      content:
        text/plain:
          schema: { type: string }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: Healthy }
        time:   { type: string, format: date-time }

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:  { type: string, description: "JWT; send as `Authorization: Bearer <access_token>`" }
        refresh_token: { type: string, description: Opaque; single use }
        token_type:    { type: string, enum: [Bearer] }
        expires_in:    { type: integer, description: Access token lifetime in seconds }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RemovalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why it was taken down — kept for the audit trail.

    Ready:
      type: object
      properties:
        status: { type: string, enum: [ready, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
          example: { database: ok, storage: ok }

    Me:
      type: object
      required: [id, email, name, roles, is_moderator]
      properties:
        id:           { type: integer }
        email:        { type: string, format: email }
        name:         { type: string }
        roles:        { type: array, items: { type: string }, example: [moderator] }
        is_moderator: { type: boolean, description: "`roles` contains `moderator`" }

    Session:
      type: object
      required: [id, created_at, last_used_at, expires_at, current]
      properties:
        id:           { type: string }
        created_at:   { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at:   { type: string, format: date-time, description: "Hard cap (365 days by default); the session also ends after 30 days unused" }
        ip:           { type: string }
        user_agent:   { type: string }
        current:      { type: boolean, description: The session this request's access token belongs to }

    SignUpRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 1024 }
        name:     { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    DuplicateEdition:
      type: object
      required: [error]
      properties:
        error:      { type: string, example: this file is already in the library }
        edition_id: { type: string, format: uuid, description: "The existing edition (absent if it was removed by a moderator)" }
        work_id:    { type: string, format: uuid, description: The work the existing edition belongs to }

    CreateWorkRequest:
      type: object
      description: >
        Only these fields are read. Server-owned fields sent in the body
        (id, created_at, updated_at, editions, tags) are ignored; editions
        are only created by uploading a file.
      required: [title]
      properties:
        title:            { type: string }
        subtitle:         { type: string }
        authors:          { type: string, description: "Phase 1: semicolon-separated. Normalized in Phase 2." }
        description:      { type: string }
        language:         { type: string }
        publication_year: { type: integer }
        isbn:             { type: string }
        openlibrary_id:   { type: string }

    Work:
      type: object
      properties:
        id:               { type: string, format: uuid }
        title:            { type: string }
        subtitle:         { type: string }
        authors:          { type: string }
        description:      { type: string }
        language:         { type: string }
        publication_year: { type: integer }
        isbn:             { type: string }
        openlibrary_id:   { type: string }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
        editions:
          type: array
          items: { $ref: "#/components/schemas/Edition" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    Edition:
      type: object
      properties:
        id:          { type: string, format: uuid }
        work_id:     { type: string, format: uuid }
        format:      { type: string }
        language:    { type: string }
        size_bytes:  { type: integer, format: int64 }
        sha256:      { type: string }
        uploaded_by: { type: integer }
        created_at:  { type: string, format: date-time }

    Tag:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    SubmitContributionRequest:
      type: object
      required: [patch]
      properties:
        patch:
          type: object
          description: |
            Flat partial object of proposed Work field overrides, validated
            at submit time (400 with a descriptive message otherwise).
            Allowed keys: `title`, `subtitle`, `authors`, `description`,
            `language`, `isbn`, `openlibrary_id` (strings; `title` must be
            non-empty; length-capped) and `publication_year` (integer,
            -5000..current year + 5). Unknown keys, wrong types, and an
            empty patch are rejected.
          additionalProperties: true

    Contribution:
      type: object
      properties:
        id:              { type: string, format: uuid }
        work_id:         { type: string, format: uuid }
        contributor_id:  { type: integer }
        contributor_name: { type: string, description: "Display name of the contributor (omitted if the user no longer exists)" }
        status:          { type: string, enum: [pending, approved, rejected] }
        patch:
          type: object
          description: As submitted; whitelisted at Approve time, not at storage.
          additionalProperties: true
        current:
          type: object
          description: |
            The target Work's present value for each field named in `patch`
            — the "old" side of the moderator-queue diff. Resolved at read
            time, so it reflects the Work as it stands now. Keys mirror
            `patch`. Omitted when empty.
          additionalProperties: true
        reviewer_id:     { type: [integer, "null"] }
        decided_at:      { type: [string, "null"], format: date-time }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    UpsertLibraryEntryRequest:
      type: object
      description: |
        Partial patch — every field is optional; only present fields are
        applied. Send `rating: null` to clear a rating.
      properties:
        status:           { type: string, enum: [want, reading, read] }
        shelf:            { type: string, description: "Free-form collection name." }
        current_page:     { type: integer, minimum: 0 }
        total_pages:      { type: integer, minimum: 0 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        rating:           { type: [integer, "null"], minimum: 1, maximum: 5 }
        notes:            { type: string }

    UserBook:
      type: object
      description: One user's personal-library entry for a work.
      properties:
        id:               { type: string, format: uuid }
        user_id:          { type: integer }
        work_id:          { type: string, format: uuid }
        status:           { type: string, enum: [want, reading, read] }
        shelf:            { type: string }
        current_page:     { type: integer }
        total_pages:      { type: integer }
        progress_percent: { type: integer }
        rating:           { type: [integer, "null"], description: "1..5 when set." }
        notes:            { type: string }
        started_at:       { type: [string, "null"], format: date-time }
        finished_at:      { type: [string, "null"], format: date-time }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
        work:
          allOf:
            - $ref: "#/components/schemas/Work"
          description: |
            The target work, embedded on read so the My Library list renders
            without a second request. Omitted if the work can't be resolved.

    Recommendation:
      type: object
      description: One recommended work plus why it surfaced.
      properties:
        work:
          $ref: "#/components/schemas/Work"
        reason:
          type: string
          description: >
            Human-readable basis, e.g. "More from authors you've read",
            "Based on tags in your library", or "Popular on LibraryZ".
        score:
          type: number
          description: Internal ranking score; omitted (0) for popularity fallbacks.
