name: Feature request
description: Suggest a new feature or enhancement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that doesn't work today?
      placeholder: As a moderator, I want to ... so that ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A rough sketch is fine — we'll refine in discussion.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one wins.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      multiple: true
      options:
        - Backend (Go API)
        - Frontend - Android
        - Frontend - Desktop
        - Frontend - Web (Wasm)
        - Frontend - iOS
        - Storage (local / S3 / MinIO)
        - Recommendations
        - Docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope check
      description: Please confirm you've read the relevant docs.
      options:
        - label: I've checked [PLAN.md](../PLAN.md) and this isn't already on the roadmap.
          required: true
        - label: I've skimmed [CONTRIBUTING.md](../CONTRIBUTING.md) — especially the "project conventions" section.
          required: true
