name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR / branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Vet (postgres-tagged tests)
        run: go vet -tags=postgres ./...

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      # Reported, not gated (yet).
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Backend statement coverage: **$total** (per-function detail in the coverage artifact: \`go tool cover -func=coverage.out\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out

  # Postgres-only paths: FTS ranking, concurrent approve/reject, advisory
  # locks (migrations, rec training, blob GC). These tests drop and recreate
  # the public schema, so they get a throwaway service container.
  backend-postgres:
    name: Backend (Go, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: libraryz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d libraryz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test (-tags=postgres)
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/libraryz?sslmode=disable
        # -p 1: the packages share one database.
        run: go test -tags=postgres -count=1 -p 1 ./...

  frontend:
    name: Frontend (Compose Multiplatform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") asks for the legacy
          # `tools` package, which current cmdline-tools' sdkmanager no longer
          # has, so the step fails. AGP downloads the platform + build-tools
          # it needs on its own.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Compile sweep (Desktop + Web + Android)
        working-directory: frontend
        run: |
          ./gradlew --no-daemon \
            :composeApp:compileKotlinDesktop \
            :composeApp:compileKotlinWasmJs \
            :composeApp:compileDebugKotlinAndroid

      - name: Tests (commonTest)
        working-directory: frontend
        run: ./gradlew --no-daemon :composeApp:allTests
